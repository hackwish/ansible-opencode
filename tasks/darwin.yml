---
# tasks file for ansible-opencode on macOS

- name: Check for Homebrew
  ansible.builtin.command: which brew
  register: brew_check
  changed_when: false
  failed_when: false
  check_mode: false
  tags: ['opencode', 'brew']

- name: Check if Opencode is installed via Homebrew
  ansible.builtin.command: brew list --formula opencode
  register: brew_formula_check
  changed_when: false
  failed_when: false
  check_mode: false
  when: brew_check.rc == 0
  tags: ['opencode', 'brew']

- name: Uninstall existing Opencode formula
  ansible.builtin.command: brew uninstall --force opencode
  register: brew_uninstall_result
  when:
    - brew_check.rc == 0
    - brew_formula_check.rc == 0
  changed_when: brew_uninstall_result.rc == 0
  tags: ['opencode', 'install']

- name: Install Opencode via Homebrew
  ansible.builtin.command: brew install {{ opencode.brew_formula }}
  register: brew_install_result
  when: brew_check.rc == 0
  changed_when: brew_install_result.rc == 0
  tags: ['opencode', 'install']

- name: Install Opencode via npm (fallback when Homebrew is unavailable)
  ansible.builtin.include_tasks: npm.yml
  when: brew_check.rc != 0
  tags: ['opencode', 'install']

- name: Create Opencode configuration directory
  ansible.builtin.file:
    path: "{{ opencode.home_dir }}/.opencode"
    state: directory
    mode: '0755'
  tags: ['opencode', 'config']

- name: Verify Opencode installation
  ansible.builtin.command: opencode --version
  register: opencode_check
  failed_when: false
  changed_when: false
  tags: ['opencode', 'verify']

- name: Install OpenCode Desktop via Homebrew Cask
  community.general.homebrew_cask:
    name: opencode-desktop
    state: present
  when: opencode_desktop_install | bool
  tags: ['opencode', 'desktop']
