---
# tasks file for ansible-opencode on macOS

- name: Install Homebrew
  homebrew:
    name: homebrew/core/openssl
    state: present
  tags: ['opencode', 'brew']

- name: Install Opencode via Homebrew (or npm fallback)
  block:
    - name: Try Homebrew first
      homebrew:
        name: opencode
        state: latest
      when: homebrew is defined

    - name: Fallback to npm
      shell: npm i -g opencode-ai
      when: homebrew is undefined
  tags: ['opencode', 'install']

- name: Create Opencode configuration directory
  file:
    path: "{{ vars.opencode.home_dir }}/.opencode"
    state: directory
    mode: '0755'
  tags: ['opencode', 'config']

- name: Verify Opencode installation
  shell: opencode --version
  register: opencode_check
  failed_when: false
  changed_when: false
  tags: ['opencode', 'verify']

- name: Install OpenCode Desktop via Homebrew Cask
  homebrew_cask:
    name: opencode-desktop
    state: present
  when: opencode_desktop_install | bool
  tags: ['opencode', 'desktop']
